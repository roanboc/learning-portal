<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
<style>
.halo{animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.halo{animation:none}}
</style>
<defs>
<radialGradient id="sphere" cx=".38" cy=".34" r=".72"><stop offset="0" stop-color="#b6fff7"/><stop offset=".4" stop-color="#1fb8b0"/><stop offset="1" stop-color="#03141b"/></radialGradient>
<radialGradient id="halo"><stop offset=".55" stop-color="#4ff0e0" stop-opacity="0"/><stop offset=".8" stop-color="#4ff0e0" stop-opacity=".22"/><stop offset="1" stop-color="#4ff0e0" stop-opacity="0"/></radialGradient>
</defs>
<g fill="#e6fbff" opacity=".6">
<circle cx="60" cy="50" r="1.2"/><circle cx="590" cy="60" r="1.2"/><circle cx="40" cy="300" r="1.2"/><circle cx="600" cy="310" r="1.2"/><circle cx="560" cy="30" r="1"/><circle cx="90" cy="330" r="1"/><circle cx="230" cy="40" r="1"/><circle cx="420" cy="330" r="1"/>
</g>
<circle class="halo" cx="320" cy="180" r="168" fill="url(#halo)"/>
<circle cx="320" cy="180" r="100" fill="url(#sphere)"/>
<ellipse cx="320" cy="180" rx="168" ry="42" transform="rotate(-14 320 180)" fill="none" stroke="#4ff0e0" stroke-opacity=".55" stroke-width="2"/>
<circle cx="196" cy="118" r="4" fill="#ffb547"/><circle cx="448" cy="112" r="3" fill="#b4ff5a"/><circle cx="472" cy="246" r="4" fill="#ff6b9a"/><circle cx="176" cy="250" r="3" fill="#c08bff"/><circle cx="300" cy="70" r="2.5" fill="#4ff0e0"/><circle cx="520" cy="180" r="2.5" fill="#ffb547"/><circle cx="110" cy="170" r="2" fill="#8fb3bd"/>
</svg>
